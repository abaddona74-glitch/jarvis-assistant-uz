# Jarvis konfiguratsiyasi.
# Ishlatish uchun nusxa oling:  cp config/jarvis.example.yaml config/jarvis.yaml

identity:
  name: "Jarvis"
  # Foydalanuvchiga qanday murojaat qilsin
  user_name: "Kamoliddin"
  # Asosiy muloqot tili: javoblar shu tilda bo'ladi
  language: "uz"

activation:
  # Uyg'otuvchi so'z. Tayyor model faqat «hey jarvis»ni biladi.
  wake_word:
    enabled: true
    backend: "openwakeword"        # openwakeword | porcupine
    model: "hey_jarvis"
    threshold: 0.5                 # 0..1 — bu balldan o'tsa, darhol uyg'onadi
    cooldown_sec: 2.0

    # Uch xil chaqiruv. «salom jarvis» va «hi jarvis» tayyor modelga faqat
    # qismincha o'xshaydi, ya'ni ball chegaradan past chiqadi. Shuning uchun
    # `candidate_threshold` dan o'tgan shubhali ovoz tashlanmaydi — matnga
    # aylantirilib, quyidagi iboralar bilan solishtiriladi.
    #
    # Diqqat: tekshirish STT chaqiruvi, ya'ni pul va ~0.5 s kechikish.
    # «hey jarvis» bunga tushmaydi (u to'g'ridan-to'g'ri chegaradan o'tadi).
    # Butunlay o'chirish uchun: phrases: []
    # Ro'yxatga yalang «jarvis» qo'shilsa, salomlashuv talab qilinmaydi —
    # ismning o'zi yetadi. Diqqat: suhbat orasida ismni aytsangiz ham
    # uyg'onadi, shuning uchun bu ataylab tanlanadigan sozlama.
    phrases: ["hey jarvis", "hi jarvis", "salom jarvis", "jarvis"]
    # Shubhali deb hisoblash chegarasi. Buni juda pastga qo'yish yaramaydi:
    # o'lchab ko'rilganda oq shovqinning o'zi 0.10–0.13 ball oladi, ya'ni
    # 0.15 dan past chegara xonadagi shitirlashdan ham STT chaqiruvini
    # keltirib chiqaradi. O'z chegarangizni bilish uchun: `jarvis wake-test`.
    candidate_threshold: 0.30
    phrase_ratio: 0.7              # so'z o'xshashligi (STT «Jervis» deb yozadi)
    verify_cooldown_sec: 3.0       # shundan tez-tez tekshirmaydi (xarajat uchun)
    verify_window_ms: 2000         # shuncha oxirgi audio matnga aylantiriladi

  # Ikki marta qarsak — "tars-tars".
  clap:
    enabled: true
    # Zarba deb hisoblash uchun energiya sakrashi (adaptiv shovqin darajasiga nisbatan)
    onset_ratio: 8.0
    min_gap_sec: 0.12              # ikki qarsak orasidagi eng qisqa vaqt
    max_gap_sec: 0.70              # eng uzun vaqt
    cooldown_sec: 2.0

  # Global tugma (UI orqali). macOS'da Accessibility ruxsati kerak.
  hotkey:
    enabled: true
    combo: "Cmd+Shift+J"

audio:
  sample_rate: 16000
  frame_ms: 20
  input_device: null               # null = tizim standarti; yoki qurilma nomi/raqami
  output_device: null

  # Uzoq masofadan gapirish uchun kirish kuchaytirgichi.
  # Xonaning narigi burchagidan chaqirmoqchi bo'lsangiz, 2.0–4.0 ga ko'taring
  # va `activation.wake_word.threshold` ni 0.35 ga tushiring.
  # Diqqat: kuchaytirish shovqinni ham kuchaytiradi — yolg'on ishga tushish
  # ko'paysa, qaytaring. Eng yaxshi natija baribir yaxshi mikrofondan keladi.
  input_gain: 1.0

  # Tinglayotganda tizim ovozini pasaytirish. Musiqa chalinayotganda
  # mikrofon uni ham eshitadi va sizning ovozingiz uning ichida yo'qoladi.
  # Aks sadoni dasturiy yo'q qilish og'ir ish; ovozni pasaytirish esa
  # arzon va aynan shu muammoni yechadi. Tinglash tugagach qaytariladi.
  duck_while_listening: true
  duck_volume: 20                # foizda

  # Gapirishni tugatganini aniqlash
  endpointing:
    backend: "webrtcvad"           # webrtcvad | energy
    aggressiveness: 2              # 0..3
    silence_ms: 900                # shuncha jimlikdan keyin yozib olish tugaydi
    max_utterance_sec: 30
    preroll_ms: 300                # uyg'otuvchi so'zdan oldingi audio (kontekst uchun)

conversation:
  # Javobdan keyin Jarvis yana tinglab turadi — «Hey Jarvis» ni har safar
  # takrorlash shart emas. false qilsangiz, har bir savol uchun uyg'otish kerak.
  follow_up: true
  first_wait_sec: 6                # uyg'ongandan keyin gapirishni shuncha kutadi
  follow_up_sec: 8                 # javobdan keyingi tinglash oynasi
  max_turns: 12                    # bitta suhbatdagi eng ko'p navbat

  # Jarvis gapirayotganda uni bo'lish. Chegara o'zi moslashadi: quloqchinda
  # sezgir, baland dinamikda esa o'z ovozidan bo'linib ketmaydi.
  barge_in: true
  barge_in_min_speech_ms: 350       # shuncha uzluksiz nutqdan keyin to'xtaydi
  barge_in_margin: 2.0              # foniga nisbatan shuncha baland bo'lishi kerak

# Eshitish va gapirish ALOHIDA tanlanadi — har biri uchun eng yaxshisini
# olish mumkin. O'zbek tili uchun tavsiya:
#   stt: mohir  (o'zbek nutqiga ixtisoslashgan)
#   tts: azure  (uz-UZ-MadinaNeural — haqiqiy o'zbek neyron ovozi)
# ElevenLabs ovozi tabiiyroq, lekin inglizcha aksent bilan gapiradi.
voice:
  stt:
    provider: "faster_whisper_uz"    # faster_whisper_uz | elevenlabs | mohir | whisper_local
    language: "uz"
    # faster_whisper_uz uchun (lokal, kalitsiz; model birinchi ishga tushishda
    # HuggingFace'dan yuklab olinadi):
    model: "hostmepanda/whisper-large-v3-turbo-uzbek-ct2"
    device: "cpu"
    compute_type: "int8"
    beam_size: 1                     # eng tez rejim; aniqlik kerak bo'lsa 5
    cpu_threads: 2                   # jismoniy yadrolar soni
    # Yengilroq model (kuchsiz PC uchun): maqsudxo1ja/uz-whisper-small-stt-v2
    # whisper_local uchun (faqat Mac):
    # model: "mlx-community/whisper-large-v3-turbo"

  tts:
    provider: "elevenlabs"         # elevenlabs | azure | mohir | macos
    gender: "female"               # female | male — zaxira ovoz shunga qarab tanlanadi
    # ElevenLabs ovoz nomi yoki 20 belgili ID. Har bir hisobdagi ovoz to'plami
    # boshqacha — bu nom topilmasa, Jarvis yuqoridagi jinsga mos ovozga o'tadi
    # va `jarvis doctor` mavjud ovozlar ro'yxatini ko'rsatadi.
    voice: "Aria"
    model: "eleven_multilingual_v2"
    speed: 1.0
    # azure uchun: uz-UZ-MadinaNeural (ayol) | uz-UZ-SardorNeural (erkak)

brain:
  model: "claude-opus-5"
  # Ishchi papka — Jarvis fayl/kod ishlarini shu yerda bajaradi
  workspace: "~/jarvis-workspace"
  max_turns: 40
  # Har bir suhbat uchun sarf chegarasi (AQSH dollarida). null = cheklovsiz.
  max_budget_usd: 2.0

memory:
  # Barqaror xotira: afzalliklar, faktlar, loyihalar, vazifalar, aloqalar
  path: "~/.jarvis/memory.db"
  # Har bir suhbatdan keyin muhim faktlarni saqlab qo'yish
  autosave: true

scheduler:
  # Jarvis'ni "eslatuvchi" emas, "yordamchi" qiladigan qism:
  # vaqti kelgan vazifalarni o'zi aytadi.
  enabled: true
  check_interval_sec: 30

  # Kunlik brief: ertalab bugungi ishlarni aytib beradi. Bo'sh satr = o'chirilgan.
  brief_time: "08:30"

  # Jim soatlar — bu oraliqda uyg'otmaydi. To'plangan eslatmalar
  # ertalab birinchi imkoniyatda aytiladi.
  quiet_start_hour: 22
  quiet_end_hour: 7

safety:
  # Xavfsizlik darvozasi: qaysi amallar tasdiq so'raydi.
  # "ask"   — ovoz/UI orqali tasdiq so'raydi
  # "allow" — avtomatik ruxsat
  # "deny"  — umuman ta'qiqlangan
  default: "ask"

  # Ovozli tasdiq: Jarvis savolni ovozda beradi va «ha» / «mayli, bajar» /
  # «yo'q» deb aytilgan javobni qabul qiladi. Tugmalar ham ishlashda davom
  # etadi — qaysi biri oldin javob bersa, o'sha hal qiladi. Noaniq javobda
  # hech qachon "ruxsat" deb taxmin qilinmaydi.
  voice_confirm:
    enabled: true
    listen_sec: 8                  # har urinishda shuncha soniya tinglaydi
    attempts: 2                    # noaniq javobda necha marta qayta so'raydi
  rules:
    Read: "allow"
    Glob: "allow"
    Grep: "allow"
    WebSearch: "allow"
    WebFetch: "allow"
    Write: "ask"
    Edit: "ask"
    Bash: "ask"
    NotebookEdit: "ask"

  # Bu naqshlar hech qachon bajarilmaydi (tasdiq so'ralmaydi ham).
  forbidden_patterns:
    - "rm -rf /"
    - "rm -rf ~"
    - ":(){ :|:& };:"
    - "mkfs"
    - "dd if=/dev/zero"
    - "sudo rm"
    - "> /dev/sda"

  # Bu papkalardan tashqariga yozish taqiqlanadi (workspace avtomatik qo'shiladi).
  writable_roots:
    - "~/jarvis-workspace"
    - "~/Downloads"

  audit_log: "~/.jarvis/audit.log"

ui:
  # Orb va telefon sahifasi shu manzilda xizmat qiladi.
  #
  #   127.0.0.1 — faqat shu kompyuter (eng xavfsiz, telefon ulanolmaydi)
  #   0.0.0.0   — tarmoqdagi barcha qurilmalar, ya'ni telefoningiz ham
  #
  # Telefonni ulash uchun `0.0.0.0` qiling VA token qo'ying. Tokensiz
  # tarmoqqa ochish — bir WiFi'dagi har kimga kompyuteringizni berish demak,
  # shuning uchun Jarvis bunday holatda ishga tushmaydi.
  host: "127.0.0.1"
  port: 8765

  # Token yaratish:  openssl rand -hex 16
  token: ""

  # Orb ekranda qayerda tursin
  position: "bottom-right"         # bottom-right | bottom-left | top-right | top-left | center

channels:
  telegram:
    enabled: false
  n8n:
    enabled: false
