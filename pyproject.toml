[project]
name = "jarvis"
version = "0.1.0"
description = "Ovoz bilan boshqariladigan shaxsiy AI yordamchi — o'zbek tilida"
requires-python = ">=3.11"
dependencies = [
    # Miya
    "claude-agent-sdk>=0.1.0",
    # Audio
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "openwakeword>=0.6.0",
    "webrtcvad>=2.0.10",
    # `webrtcvad` ichida `pkg_resources` ni import qiladi. Python 3.12 dan
    # boshlab u standart muhitda yo'q, shuning uchun aniq talab qilamiz —
    # aks holda VAD jimgina zaxira detektorga o'tib ketadi va gapirish
    # tugaganini aniqlash sezilarli yomonlashadi.
    "setuptools>=68",
    # Tarmoq
    "httpx>=0.27",
    "websockets>=12.0",
    # TTS (edge) — bepul neyron ovozlar, kalit talab qilmaydi
    "edge-tts>=7.0",
    "soundfile>=0.12",
    # Konfiguratsiya
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
# Bepul miya (Google AI Studio kaliti bilan)
gemini = ["google-genai>=1.0"]
# Lokal (internetsiz) STT — Apple Silicon uchun tez
local-stt = ["mlx-whisper>=0.4.0"]
# Lokal STT — Windows/Linux CPU uchun (o'zbekcha CT2 modellar bilan)
fw-stt = ["faster-whisper>=1.0.0"]
porcupine = ["pvporcupine>=3.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
